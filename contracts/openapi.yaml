    "/api/v1/properties/{id}/report.pdf": {
      "get": {
        "summary": "Download Dossier Report",
        "description": "Authenticated read-only current dossier report. Summary is mandatory; sections are a comma-separated whitelist: summary,documents,risk,publications,evidence,history,signals,sources. Default includes all sections. At most 100 rows per section, with explicit partial scope. No jobs, audit writes, evidence or decisions are created; historical signal PDFs remain unchanged.",
        "operationId": "downloadDossierReport",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "title": "Id"
            }
          },
          {
            "name": "sections",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 120,
              "default": "summary,documents,risk,publications,evidence,history,signals,sources",
              "title": "Sections"
            }
          },
          {
            "name": "language",
            "in": "query",
            "required": false,
            "schema": {
              "enum": [
                "ru",
                "kk"
              ],
              "type": "string",
              "default": "ru",
              "title": "Language"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Current dossier PDF, RU or KK",
            "content": {
              "application/pdf": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Read role required"
          },
          "404": {
            "description": "Property not found"
          },
          "413": {
            "description": "Selected report exceeds bounded payload or PDF size"
          },
          "422": {
            "description": "Invalid sections, language or property ID"
          },
          "503": {
            "description": "Offline PDF renderer unavailable, busy or timed out; retry is read-only"
          }
        }
      }
    },
