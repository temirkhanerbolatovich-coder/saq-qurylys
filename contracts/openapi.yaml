{
  "openapi": "3.1.0",
  "info": {
    "title": "SAQ QURYLYS API",
    "version": "0.34.0",
    "description": "SAQ QURYLYS contract. Registry/OCR, dated legal review, manual R1-R6, immutable signals/human decisions/PDF export and passive supporting PDF upload implemented. Explicit bounded AN GROUPS /payment commercial-page import is implemented; opt-in reviewed-URL schedules use the existing worker queue; general crawling and social search scheduling remain planned. JSON is valid YAML 1.2. Manual monitoring candidates, immutable DEMO registry snapshots, comparisons and preliminary incident decisions are additive; the closed customer registry remains unavailable. Explicit licensed Primeminister.kz information import is implemented through leased jobs. Operator-provided KHC public PDF versions and page-text search preserve provenance and never establish legal applicability or modify risk. Authenticated read-only exports return exact saved PDFs or bounded derived copies; signal exports retain frozen snapshots. Shared monitoring query profiles have append-only v1 parameter/compiled-query snapshots; saving never starts search or scheduling. Parser V2 dictionary registration and explicit activation history are available; V2 profiles freeze offline query previews. These operations do not execute search, collection or risk decisions. Explicit V2 profile runs reuse the bounded Threads access gate. Findings are captured only from saved successful pages, with append-only content/context versions and query observations. Explicit text-only imports create NEW materials without analysis, identity, evidence or risk decisions. New evidence separates publication from capture with explicit date_basis; missing legacy date provenance is unspecified. Existing snapshots and archived files are never backfilled. Exact manual PAYMENT_TERM proposals remain PENDING; a distinct authenticated analyst reviews them before the separate guarded evidence/R2 workflow. Original text and archived decisions are not replaced. Property provenance uses a bounded direct source-package lookup. Signal snapshots optionally freeze reviewer identity; legacy reviewer IDs remain explicit and historical bytes are not rewritten. Dashboard pending counts include only actionable non-stale current drafts."
  },
