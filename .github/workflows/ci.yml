name: First vertical slice
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_DB: saq_ci
          POSTGRES_USER: saq_ci
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saq_ci -d saq_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://saq_ci:ci-ephemeral-only@localhost:5432/saq_ci
      SESSION_SECRET: ci-disposable-session-secret-at-least-32-characters
      BOOTSTRAP_ANALYST_USERNAME: analyst
      BOOTSTRAP_ANALYST_PASSWORD: ci-disposable-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend/app backend/tests backend/alembic
      - run: python -m ruff format --check backend/app backend/tests backend/alembic
      - working-directory: backend
        run: python -m pytest -q
      - working-directory: backend
        run: python -m alembic upgrade head && python -m alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
