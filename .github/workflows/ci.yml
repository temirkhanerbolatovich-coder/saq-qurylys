name: SAQ QURYLYS checks
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_repository_hygiene.py
      - name: Compose overlays with disposable parameters only
        env:
          POSTGRES_DB: ci_config
          POSTGRES_USER: ci_config
          POSTGRES_PASSWORD: ci-config-placeholder
          PUBLIC_HOST: audit.example.invalid
          SAQ_API_IMAGE: audit-api:local
          SAQ_FRONTEND_IMAGE: audit-ui:local
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --no-env-resolution --quiet
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml config --no-env-resolution --quiet
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.public.yml -f docker-compose.https.yml -f docker-compose.prebuilt.yml config --no-env-resolution --quiet
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_DB: saq_ci
          POSTGRES_USER: saq_ci
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saq_ci -d saq_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://saq_ci:ci-ephemeral-only@localhost:5432/saq_ci
      SESSION_SECRET: ci-disposable-session-secret-at-least-32-characters
      BOOTSTRAP_ANALYST_USERNAME: analyst
      BOOTSTRAP_ANALYST_PASSWORD: ci-disposable-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install OCR and PDF runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core tesseract-ocr tesseract-ocr-rus tesseract-ocr-kaz tesseract-ocr-eng
      - run: pip install -r backend/requirements-dev.txt
      - name: Check local backup and evaluation tooling
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Reject private artifacts and misplaced frontend uploads
        run: python scripts/check_repository_hygiene.py
      - name: Verify repository UI skill search (offline standard library)
        run: |
          python .agents/skills/ui-ux-pro-max/scripts/search.py "filter chips wrap" --domain ux --json > /tmp/saq-ui-guidance.json
          python -c "import json; data=json.load(open('/tmp/saq-ui-guidance.json')); assert data['domain']=='ux' and data['count'] > 0; print('Repository UI skill search passed')"
      - run: python -m ruff check --config backend/pyproject.toml scripts
      - run: python -m ruff format --check --config backend/pyproject.toml scripts
      - name: Evaluate synthetic RU/KZ corpus (quality targets reported separately)
        run: python scripts/evaluate_ocr.py --output output/evaluation/ci
      - name: Evaluate structured fields on the versioned regression corpus
        run: python scripts/evaluate_ocr.py --manifest data/evaluation/ru-kz-fields-v2.json --output output/evaluation/ci-fields
      - name: Preserve synthetic evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-ocr-evaluation
          path: output/evaluation/ci*/
          retention-days: 14
      - run: python -m ruff check backend/app backend/tests backend/alembic
      - run: python -m ruff format --check backend/app backend/tests backend/alembic
      - working-directory: backend
        run: python -m pytest -q
      - working-directory: backend
        run: python -m alembic upgrade head && python -m alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: node --test scripts/test-*.mjs
      - run: npm run build
  browser-e2e:
    env:
      SAQ_ISOLATED_ACCEPTANCE: "1"
      SAQ_E2E_BASE_URL: http://localhost:3090
      SAQ_QUERY_PROFILES_LIVE: "1"
      SAQ_URL_SCHEDULES_LIVE: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install synthetic OCR fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          python -m pip install -r backend/requirements-dev.txt
      - name: Install Chromium and browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Generate private disposable configuration
        run: python scripts/configure_local.py --port 3090
      - name: Build and start the local MVP
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml build
          mkdir -p storage
          # The Linux bind mount must be writable by the unprivileged API/worker user.
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm --no-deps --user root --entrypoint chown api saq:saq /app/storage
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up --no-build -d --wait --wait-timeout 180
      - name: Wait for the frontend proxy
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused --max-time 5 http://localhost:3090/api/v1/auth/csrf > /dev/null
      - name: Verify real RU/KZ OCR and create browser fixtures
        run: |
          python scripts/verify_ocr.py > /dev/null
          echo "Synthetic RU/KZ OCR verified; browser fixtures created."
      - name: Run browser E2E against the local MVP
        working-directory: frontend
        env:
          SAQ_ISOLATED_ACCEPTANCE: "1"
        run: npm run test:e2e
      - name: Stop the disposable local MVP
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose -f docker-compose.yml -f docker-compose.dev.yml down
          fi
