name: saq-qurylys
services:
  db:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/configure_local.py}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/configure_local.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure_local.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_ROOT: /app/storage
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
